    Research Interests:
      - bullet: "Computational, theoretical, and statistical modeling of galaxy clusters, groups and massive galaxies, and their observational signatures in X-ray and microwave"
      - bullet: "Galaxy clusters and groups as cosmological probes"
      - bullet: "Physical processes in the intracluster medium"
      - bullet: "Diffuse emission from the intergalactic medium and the circumgalactic medium"
      - bullet: "Astronomical software development"

